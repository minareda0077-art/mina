<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم في العملاء - Mina Reda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: #0b0f19;
        }
        .animate-spin-hover:hover {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
    </style>
</head>
<body class="text-slate-200 font-sans antialiased min-h-screen pb-12">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/4 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-8 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-black text-white">لوحة تحكم عملاء Google Maps 🎯</h1>
                <p class="text-slate-400 mt-2">إدارة العملاء، استعراض المواقع التجريبية 3D، وإرسال رسائل الواتساب بنقرة واحدة.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="fetchLeads()" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold px-5 py-3 rounded-xl transition-all duration-300 flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-rotate animate-spin-hover"></i> تحديث البيانات
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 my-8">
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-slate-400 text-sm font-medium">إجمالي العملاء المستخرجين</span>
                    <h3 id="stat-total" class="text-3xl font-black text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400 text-xl"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-slate-400 text-sm font-medium">مواقع 3D جاهزة</span>
                    <h3 id="stat-sites" class="text-3xl font-black text-emerald-400 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-xl"><i class="fa-solid fa-globe"></i></div>
            </div>
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-slate-400 text-sm font-medium">متوسط تقييم العملاء</span>
                    <h3 id="stat-rating" class="text-3xl font-black text-amber-400 mt-1">0.0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400 text-xl"><i class="fa-solid fa-star"></i></div>
            </div>
        </div>

        <!-- Search & Filters -->
        <div class="glass p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-center justify-between mb-8">
            <div class="relative w-full md:w-96">
                <input type="text" id="search-input" oninput="filterLeads()" placeholder="البحث باسم النشاط أو التصنيف..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 pr-10 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all duration-300">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="filter-buttons">
                <button onclick="setCategoryFilter('all')" class="px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition-all duration-300">الكل</button>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="glass rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 text-sm border-b border-slate-800">
                            <th class="px-6 py-4 font-bold">اسم النشاط</th>
                            <th class="px-6 py-4 font-bold">التصنيف</th>
                            <th class="px-6 py-4 font-bold">التقييم على جوجل</th>
                            <th class="px-6 py-4 font-bold">رقم الهاتف</th>
                            <th class="px-6 py-4 font-bold">تاريخ الإضافة</th>
                            <th class="px-6 py-4 font-bold text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="leads-list" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                                <i class="fa-solid fa-circle-notch animate-spin text-3xl text-blue-500 mb-3 block mx-auto"></i>
                                جاري تحميل بيانات العملاء...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const owner = "minareda0077-art";
        const repo = "mina";
        let allLeads = [];
        let activeCategory = 'all';

        async function fetchLeads() {
            const listEl = document.getElementById('leads-list');
            listEl.innerHTML = `
                <tr>
                    <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                        <i class="fa-solid fa-circle-notch animate-spin text-3xl text-blue-500 mb-3 block mx-auto"></i>
                        جاري تحميل بيانات العملاء من GitHub...
                    </td>
                </tr>
            `;

            try {
                // Fetch list of files in leads-data folder
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/leads-data`);
                if (!res.ok) {
                    if (res.status === 404) {
                        listEl.innerHTML = `
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                                    <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3 block mx-auto"></i>
                                    لا يوجد عملاء حالياً. ابدأ بتشغيل نظام n8n لجلب أول عميل!
                                </td>
                            </tr>
                        `;
                        return;
                    }
                    throw new Error('فشل تحميل الملفات');
                }

                const files = await res.json();
                const jsonFiles = files.filter(f => f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    listEl.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                                <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3 block mx-auto"></i>
                                المجلد فارغ. لم يتم العثور على عملاء.
                            </td>
                        </tr>
                    `;
                    return;
                }

                // Fetch content of each file
                const fetchPromises = jsonFiles.map(file => fetch(file.download_url).then(r => r.json()));
                allLeads = await Promise.all(fetchPromises);
                
                // Sort by date added (descending)
                allLeads.sort((a, b) => new Date(b.generated_at || 0) - new Date(a.generated_at || 0));

                updateStats();
                updateCategoryFilters();
                renderLeads();

            } catch (err) {
                console.error(err);
                listEl.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-red-400">
                            <i class="fa-solid fa-triangle-exclamation text-4xl mb-3 block mx-auto"></i>
                            حدث خطأ أثناء تحميل البيانات. تأكد من أن المستودع يحتوي على مجلد leads-data ومتاح للعامة.
                        </td>
                    </tr>
                `;
            }
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = allLeads.length;
            document.getElementById('stat-sites').innerText = allLeads.filter(l => l.website_url).length;
            
            const ratings = allLeads.map(l => parseFloat(l.rating || 0)).filter(r => r > 0);
            const avgRating = ratings.length ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : '0.0';
            document.getElementById('stat-rating').innerText = avgRating;
        }

        function updateCategoryFilters() {
            const categories = new Set(allLeads.map(l => l.category).filter(Boolean));
            const filterContainer = document.getElementById('filter-buttons');
            
            // Reset to keep only 'All' button
            filterContainer.innerHTML = `
                <button onclick="setCategoryFilter('all')" class="px-4 py-2 rounded-lg text-sm font-bold ${activeCategory === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'} transition-all duration-300 font-bold">الكل</button>
            `;

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg text-sm font-bold ${activeCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'} transition-all duration-300`;
                btn.innerText = cat;
                btn.onclick = () => setCategoryFilter(cat);
                filterContainer.appendChild(btn);
            });
        }

        function setCategoryFilter(cat) {
            activeCategory = cat;
            updateCategoryFilters();
            renderLeads();
        }

        function filterLeads() {
            renderLeads();
        }

        function renderLeads() {
            const listEl = document.getElementById('leads-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const filtered = allLeads.filter(lead => {
                const matchesSearch = (lead.name || '').toLowerCase().includes(searchVal) || 
                                      (lead.category || '').toLowerCase().includes(searchVal);
                const matchesCategory = activeCategory === 'all' || lead.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                            لا يوجد نتائج تطابق بحثك.
                        </td>
                    </tr>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(lead => {
                const dateStr = lead.generated_at ? new Date(lead.generated_at).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'short', day: 'numeric'
                }) : 'غير معروف';

                return `
                    <tr class="hover:bg-slate-900/30 transition-all duration-200">
                        <td class="px-6 py-4 font-bold text-white">${lead.name}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">${lead.category || 'غير مصنف'}</span>
                        </td>
                        <td class="px-6 py-4 text-amber-400 font-bold">
                            <i class="fa-solid fa-star text-xs ml-1"></i>${lead.rating || '4.5'}
                            <span class="text-slate-500 text-xs font-normal">(${lead.reviewsCount || '10'})</span>
                        </td>
                        <td class="px-6 py-4 text-slate-300 select-all">${lead.phone || 'غير مسجل'}</td>
                        <td class="px-6 py-4 text-slate-400 text-sm">${dateStr}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center justify-center gap-3">
                                <a href="${lead.website_url}" target="_blank" class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-bold transition-all duration-300 flex items-center gap-1.5 border border-slate-700">
                                    <i class="fa-solid fa-eye"></i> استعراض الموقع
                                </a>
                                <a href="${lead.whatsapp_link}" target="_blank" class="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all duration-300 flex items-center gap-1.5 shadow-md">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> مراسلة واتساب
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Load data on start
        window.onload = fetchLeads;
    </script>
</body>
</html>
